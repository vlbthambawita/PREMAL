title: PREMAL
description: A curated map of papers on Privacy-Preserving Machine Learning with Fully Homomorphic Encryption.

# Served as a project page at https://vlbthambawita.github.io/PREMAL/
url: "https://vlbthambawita.github.io"
baseurl: "/PREMAL"

# jekyll-github-metadata (bundled with the github-pages gem) populates
# site.github, which _layouts/default.html uses for the GitHub nav link. When
# Jekyll runs inside GitHub Actions rather than on Pages' own builder, the
# plugin cannot infer the repository from the checkout and aborts the build, so
# name it explicitly.
repository: vlbthambawita/PREMAL

# No bundled theme — _layouts/default.html ships its own minimal CSS + Mermaid loader.
# GitHub Pages plugins beyond the default allowlist will not load; keep this empty.
plugins: []

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - papers/
  # Slidev's built output. Jekyll must not touch it: it drops files whose names
  # start with an underscore, and Vite names a required chunk
  # _plugin-vue_export-helper-<hash>.js. CI builds the decks directly into
  # _site/decks/ after Jekyll has run (see .github/workflows/pages.yml).
  - decks/
  - papers_Transformer_FHE/
  - slidev/
  - SLIDES_PLAN.md
  - TEACHING_GUIDE.md
  - extraction-template.md
  - frontpage-template.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - vendor/

# Pretty URLs: summaries/foo.md is served as /summaries/foo
permalink: pretty

# Teaching decks for the Transformer + FHE collection.
#
# One record per deck; slides.md renders the tiles from this file, so nothing on
# the /slides/ page is hand-written HTML.
#
#   slug     directory under /decks/ — must match slidev/src/<slug>.md
#   module   key into the `modules` list below (drives colour + filter chips)
#   status   done   = deck is written and built; the tile links to it
#            todo   = planned; the tile renders greyed out and is not a link
#   strategy a | b | c | -   the primer's three ways out:
#            a = approximate everything (FHE-only, non-interactive)
#            b = split the work (hybrid HE + MPC, interactive)
#            c = redesign the model
#            m = pure MPC baseline, no FHE
#            - = survey, systems or infrastructure paper
#
# Keep `hook` to one sentence. Numbers in hooks must come from the paper.

modules:
  - key: primer
    name: Start here
    colour: "#1a7f37"
  - key: surveys
    name: Surveys & where the field stands
    colour: "#8250df"
  - key: fhe-native
    name: FHE-native, non-interactive inference
    colour: "#0969da"
  - key: hybrid
    name: Hybrid HE + MPC
    colour: "#bc4c00"
  - key: mpc
    name: Pure MPC baselines
    colour: "#656d76"
  - key: training
    name: Training & fine-tuning under encryption
    colour: "#cf222e"
  - key: systems
    name: Systems & hardware acceleration
    colour: "#0f6b6b"
  - key: medical
    name: Medical & federated
    colour: "#bf3989"

decks:
  # --- Module 0 — Primer ----------------------------------------------------
  - slug: primer-fhe-transformers
    module: primer
    status: done
    title: "Why transformers are hard to encrypt"
    authors: PREMAL
    year: 2026
    strategy: "-"
    slides: 16
    hook: >-
      The one deck to read first: CKKS, slots, noise, depth, bootstrapping, and the four
      operators that make a transformer hard to run under encryption.

